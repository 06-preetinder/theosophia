[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theosophia"
version = "0.1.0"
description = "Theosophia: Enterprise Company Brain - Autonomous Domain Knowledge Extraction & Executable Skill Compilation"
authors = [{ name = "Preetinderjeet Singh", email = "singhpreetinder229@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
ml = [
    "gliner>=0.2.0",
    "google-genai>=0.1.0",
    "numpy>=1.26.0"
]
graph = [
    "neo4j>=5.18.0"
]
