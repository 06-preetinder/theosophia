<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theosophia - Autonomous Enterprise Knowledge Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/dribbble.css">
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm bg-[#080c14] text-slate-200">

  <!-- Left Sidebar (Dribbble Glassmorphism Style) -->
  <aside class="w-64 border-r border-white/5 bg-[#0b101c]/80 backdrop-blur-xl flex flex-col justify-between p-4 z-20 flex-shrink-0">
    <div class="space-y-6">
      <!-- App Brand -->
      <div class="flex items-center gap-3 px-2 py-2">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg shadow-indigo-500/25">
          <div class="h-full w-full bg-[#0b101c] rounded-xl flex items-center justify-center font-bold text-white tracking-wider">
            &#920;
          </div>
        </div>
        <div>
          <h1 class="font-extrabold text-sm tracking-tight text-white flex items-center gap-1.5">
            Theosophia <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">AI</span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium">Fintech Knowledge Brain</p>
        </div>
      </div>

      <!-- Department Workspace Selector -->
      <div class="px-2">
        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1.5 font-mono">Workspace Division</label>
        <div class="relative">
          <select id="workspace-select" onchange="onWorkspaceChange(this.value)" class="w-full bg-[#111827] border border-white/10 rounded-lg px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-indigo-500 appearance-none cursor-pointer">
            <option value="ALL">All Divisions (Global Brain)</option>
            <option value="Compliance">Financial Crime & Compliance (AML)</option>
            <option value="Disputes">Payments, Chargebacks & Disputes</option>
            <option value="Onboarding">KYC & Customer Due Diligence</option>
            <option value="Treasury">G10 FX Trading & Treasury Ops</option>
          </select>
          <div class="absolute right-3 top-2.5 pointer-events-none text-slate-400 text-xs">&#9662;</div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="space-y-1 font-medium px-1">
        <button onclick="switchTab('graph-explorer')" id="tab-btn-graph" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-600/15 text-white border border-indigo-500/30 transition-all text-left font-semibold">
          <i data-lucide="network" class="w-4 h-4 text-indigo-400"></i> Knowledge Topology
        </button>
        <button onclick="switchTab('skill-runtime')" id="tab-btn-runtime" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-400 hover:text-slate-200 transition-all text-left">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Autonomous Skill SER
        </button>
        <button onclick="switchTab('audit-provenance')" id="tab-btn-audit" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-400 hover:text-slate-200 transition-all text-left">
          <i data-lucide="file-clock" class="w-4 h-4"></i> SM&CR Audit Log
        </button>
        <a href="/static/index.html#overview" target="_blank" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-400 hover:text-slate-200 transition-all text-left block">
          <i data-lucide="book-open" class="w-4 h-4"></i> Technical Docs
        </a>
      </nav>
    </div>

    <!-- Tenant Status Footer -->
    <div class="border-t border-white/5 pt-4 px-2">
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="flex items-center gap-1.5 text-emerald-400 font-mono text-[11px]">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MCP Ready
        </span>
        <span class="text-slate-400 text-[10px] font-mono">Tenant A-842</span>
      </div>
      <div class="p-2 rounded-lg bg-black/40 border border-white/5 text-[11px] text-slate-400 space-y-0.5 font-mono">
        <div class="flex justify-between"><span>SLA:</span> <span class="text-slate-200">&lt; 15ms</span></div>
        <div class="flex justify-between"><span>Guards:</span> <span class="text-emerald-400">Deterministic</span></div>
      </div>
    </div>
  </aside>

  <!-- Right Main Workspace -->
  <main class="flex-1 flex flex-col min-w-0 bg-[#080c14] relative overflow-hidden">
    <!-- Top Bar -->
    <header class="h-16 border-b border-white/5 px-6 flex items-center justify-between bg-[#0b101c]/40 backdrop-blur-md z-10 flex-shrink-0">
      <div class="flex items-center gap-3">
        <h2 id="current-view-name" class="font-bold text-base text-white">Interactive Enterprise Graph Navigator</h2>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/25">Scale-Ready Cytoscape</span>
      </div>

      <div class="flex items-center gap-3">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400"></i>
          <input id="graph-search-input" onkeyup="onSearchEntity(this.value)" placeholder="Search entity, policy, threshold..." class="bg-[#111827] border border-white/10 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder:text-slate-400 w-56 focus:outline-none focus:border-indigo-500 font-mono" />
        </div>
        <button onclick="refreshGraph()" class="p-2 rounded-lg bg-[#111827] hover:bg-white/10 text-slate-300 border border-white/10 cursor-pointer" title="Reset View">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <!-- Dynamic Workspace Container -->
    <div class="flex-1 p-5 overflow-hidden flex flex-col min-h-0 relative">
